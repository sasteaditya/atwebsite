<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Shipment | Aditya Transport</title>
<meta name="description" content="Track your Aditya Transport consignment using your LR number and vehicle number. See whether your load is in transit or delivered.">
<link rel="canonical" href="https://www.adityatransport.com/track">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f7fc;--panel:#fff;--ink:#0b1f3a;--muted:#4a5d78;--line:#dce6f2;--field:#f8fafd;--blue:#1f7fc0;--amber:#f5b324;--ok:#15803d;--okbg:#e8f6ee;--warn:#b45309;--warnbg:#fdf3e3;--bad:#b42318;--badbg:#fcebea;--idle:#c3cedd}
html[data-theme=dark]{--bg:#0b1f3a;--panel:#122b4f;--ink:#e9f1fa;--muted:#a9bcd3;--line:rgba(159,214,245,.2);--field:#0e2647;--blue:#6fc0f0;--ok:#4ade80;--okbg:#10291c;--warn:#f5a524;--warnbg:#2e2210;--bad:#f87171;--badbg:#2e1416;--idle:#33506f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh}
header{max-width:1100px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:54px;width:auto;display:block}
.logo-dark{display:none}html[data-theme=dark] .logo-light{display:none}html[data-theme=dark] .logo-dark{display:block}
header a.back{color:var(--blue);font-weight:600;text-decoration:none;font-size:15px}
main{max-width:560px;margin:10px auto 60px;padding:0 16px}
h1{font:800 clamp(28px,6vw,38px)/1.15 Archivo,Georgia,serif;margin:10px 0 8px}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 14px 40px rgba(11,31,58,.08)}
label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
input{width:100%;height:48px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:0 14px;font:600 16px "IBM Plex Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
input::placeholder{text-transform:none;font-weight:400;color:var(--muted);letter-spacing:0}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
.f+.f{margin-top:14px}
button.go{margin-top:18px;width:100%;height:50px;border:0;border-radius:12px;background:var(--amber);color:#0b1f3a;font:700 16px "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0;text-align:center}
#out{margin-top:20px}
.badge{border-radius:12px;padding:14px 16px;font-weight:600;line-height:1.4}
.badge small{display:block;font-weight:400;color:var(--ink);opacity:.85;margin-top:2px}
.bad{background:var(--badbg);color:var(--bad)}
.lrhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.no{font:800 24px Archivo,sans-serif;letter-spacing:.02em}
.pill{border-radius:999px;padding:4px 14px;font-size:13px;font-weight:700}
.pill.d{background:var(--okbg);color:var(--ok)}.pill.t{background:var(--warnbg);color:var(--warn)}
.route{color:var(--muted);margin:8px 0 4px;overflow-wrap:anywhere}.route b{color:var(--ink)}
.drops{margin:16px 0 4px;display:flex;flex-direction:column;gap:8px}.drops h3{font-size:14px;margin:0 0 2px}
.drop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.drop .dn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px}
.drop .dt{flex:1;min-width:0;overflow-wrap:anywhere}.drop .dt span{color:var(--muted)}.drop .dt small{display:block;color:var(--muted);font-size:12px}
.drop .pill{flex:none;font-size:12px;padding:3px 10px}
.tl{list-style:none;margin:18px 0 6px;padding:0}
.tl li{position:relative;padding:0 0 22px 38px;min-height:42px}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:11px;top:24px;bottom:-2px;width:2px;background:var(--idle)}
.tl li:last-child:before{display:none}
.tl .dot{position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;background:var(--idle);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.tl li.done .dot{background:var(--ok)}.tl li.done:before{background:var(--ok)}
.tl li.now .dot{background:var(--amber);color:#0b1f3a;box-shadow:0 0 0 5px rgba(245,179,36,.28)}
.tl b{display:block}.tl span{color:var(--muted);font-size:14px}
.tl li.wait b,.tl li.wait span{color:var(--muted)}
.links{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.links a{color:var(--blue);font-weight:600;text-decoration:none}
.help{margin-top:22px;text-align:center;color:var(--muted);font-size:14px}.help a{color:var(--blue);font-weight:600;text-decoration:none}
.sp{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,31,58,.25);border-top-color:#0b1f3a;animation:spin .8s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
.loader{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:6px 0 2px}
.ring{width:50px;height:50px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--amber);border-right-color:var(--blue);animation:spin .9s linear infinite}
.ltext{font-weight:600;min-height:24px}
.lsub{font-size:13px;color:var(--muted);margin-top:-6px}
.bar{width:100%;height:5px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar span{position:absolute;top:0;bottom:0;width:35%;border-radius:4px;background:linear-gradient(90deg,var(--amber),var(--blue));animation:slide 1.3s ease-in-out infinite}
.skel{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.skel div{display:flex;gap:12px;align-items:center}
.skel i{display:block;width:26px;height:26px;border-radius:50%;flex:none}
.skel b{display:block;height:12px;border-radius:6px;flex:1}
.skel i,.skel b{background:linear-gradient(90deg,var(--line) 25%,var(--field) 50%,var(--line) 75%);background-size:200% 100%;animation:shim 1.4s ease-in-out infinite}
.upd{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:12px}
.upd i{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:breathe 1s ease-in-out infinite}
.badge{display:flex;gap:12px;align-items:flex-start;margin-bottom:4px}
.badge .ic{font-size:22px;line-height:1.2;flex:none}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}
.msg{margin-top:12px}
#res{margin-bottom:16px}
#res[hidden],.msg[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{left:-35%}100%{left:100%}}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.sp,.ring,.bar span,.skel i,.skel b{animation:breathe 1.2s ease-in-out infinite}.bar span{left:0;width:100%}}
</style>
</head>
<body>
<header>
  <a href="/"><img class="logo-light" src="/images/logo.png" alt="Aditya Transport"><img class="logo-dark" src="/images/logo-light.png" alt="Aditya Transport"></a>
  <a class="back" href="/">&larr; Back to Home</a>
</header>
<main>
  <h1 id="ttl">Track your shipment</h1>
  <p class="lead">Enter the LR number from your lorry receipt (or the placement number from your vehicle placed email) and the vehicle number to see where your load stands.</p>
  <section class="card" id="res" hidden></section>
  <form class="card" id="f" autocomplete="off" novalidate>
    <div class="f"><label for="lr">LR or Placement number</label><input id="lr" name="lr" placeholder="Enter LR or placement number" inputmode="text" autocapitalize="characters" required></div>
    <div class="f"><label for="veh">Vehicle number</label><input id="veh" name="veh" placeholder="Enter vehicle number" autocapitalize="characters" required></div>
    <button class="go" type="submit" id="go">Track shipment</button>
    <p class="hint">Spaces and dashes do not matter.</p>
    <div class="badge bad msg" id="msg" hidden role="alert"></div>
  </form>
  <p class="help">Need help? Write to <a href="mailto:support@adityatransport.com">support@adityatransport.com</a></p>
</main>
<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbzSpHDJ2-i3b35geMmvIl3z8ZbAuBX0q1aK67kpYssWdmNwEsm7xXbnmhusUfHM33Ae/exec";
  try{var t=localStorage.getItem('at-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}
  var $=function(id){return document.getElementById(id)},f=$('f'),go=$('go'),res=$('res'),msg=$('msg');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function call(body){
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},30000);
    return fetch(API,{method:'POST',body:JSON.stringify(body),signal:ctl.signal}).then(function(r){return r.json()}).then(function(j){clearTimeout(tm);return j},function(e){clearTimeout(tm);throw e});
  }
  function badge(cls,icon,title,sub){return '<div class="badge '+cls+'" role="status"><div class="ic" aria-hidden="true">'+icon+'</div><div>'+title+(sub?'<small>'+sub+'</small>':'')+'</div></div>'}
  var ltimer=0;
  function showRes(h){clearInterval(ltimer);res.innerHTML=h;res.hidden=false}
  function hideRes(){clearInterval(ltimer);res.hidden=true}
  function setMsg(m){msg.textContent=m;msg.hidden=false}
  function showLoading(first){
    var m=[first||'Connecting to Aditya Transport...','Checking this LR...','Fetching delivery status...','Almost there...','Still working, this can take up to 15 seconds...'];
    showRes('<div class="loader" role="status" aria-live="polite"><div class="ring" aria-hidden="true"></div><div class="ltext" id="ltext">'+esc(m[0])+'</div><div class="lsub" id="lsub">Please keep this page open</div><div class="bar" aria-hidden="true"><span></span></div><div class="skel" aria-hidden="true"><div><i></i><b></b></div><div><i></i><b style="max-width:75%"></b></div><div><i></i><b style="max-width:55%"></b></div></div></div>');
    var i=0,t0=Date.now();
    ltimer=setInterval(function(){var el=$('ltext'),sb=$('lsub');if(!el){clearInterval(ltimer);return}
      i=Math.min(i+1,m.length-1);el.textContent=m[i];sb.textContent='Please keep this page open \u00b7 '+Math.round((Date.now()-t0)/1000)+'s'},2500);
  }
  function cget(k){try{return JSON.parse(localStorage.getItem('trk:'+k)||'null')}catch(e){return null}}
  function cput(k,j){try{localStorage.setItem('trk:'+k,JSON.stringify(j))}catch(e){}}
  function render(d,stale){
    var st=d.stage||(d.delivered?'delivered':'transit'),done=st==='delivered',placed=st==='placed',id=d.lrNo||d.placementNo||'';
    var route=function(x,y){return esc(x||'')+' &rarr; '+esc(y||'')};
    var vinfo=[d.veh?'Vehicle '+esc(d.veh):'',d.vehType?esc(d.vehType):'',d.capacity?esc(d.capacity)+' MT':''].filter(Boolean).join(' &middot; ');
    var steps=[],n=0;
    if(placed||d.placementNo||d.placedOn){n++;steps.push({c:placed?'now':'done',i:placed?'':'&#10003;',t:placed?'Vehicle placed, going to load':'Vehicle placed',s:(d.placedOn?esc(d.placedOn)+' &middot; ':'')+(vinfo||'Vehicle assigned')+(d.from?' &middot; Loading at '+esc(d.from)+(d.fromPlace?' ('+esc(d.fromPlace)+')':''):'')+(placed&&d.expectedLoading?' &middot; Expected loading '+esc(d.expectedLoading):'')})}
    n++;steps.push({c:placed?'wait':'done',i:placed?String(n):'&#10003;',t:placed?'Loading and LR':'Loaded, LR issued',s:placed?'LR will be issued after loading and invoice':esc(d.date)+(d.lrNo?' &middot; LR '+esc(d.lrNo):'')+(d.from?' &middot; Booked by '+esc(d.from):'')});
    n++;steps.push({c:placed?'wait':done?'done':'now',i:placed?String(n):done?'&#10003;':'',t:done?'Transported':'In transit',s:placed?'Starts after loading':(d.veh?'Vehicle '+esc(d.veh):'On the way')+((d.fromPlace||d.toPlace)?' &middot; '+route(d.fromPlace,d.toPlace):'')});
    n++;steps.push({c:done?'done':'wait',i:done?'&#10003;':String(n),t:done?'Delivered':'Delivery',s:done?((d.deliveredOn?esc(d.deliveredOn)+' &middot; ':'')+'Delivered to '+esc(d.to||'consignee')):'Awaiting delivery to '+esc(d.to||'consignee')});
    var li=steps.map(function(x){return '<li class="'+x.c+'"><span class="dot" aria-hidden="true">'+x.i+'</span><b>'+x.t+'</b><span>'+x.s+'</span></li>'}).join('');
    var pill=placed?'<span class="pill t">Vehicle placed</span>':'<span class="pill '+(done?'d':'t')+'">'+(done?'Delivered':'In transit')+'</span>';
    var title=placed?'Vehicle placed by Aditya Transport':'Genuine LR issued by Aditya Transport';
    var sub=placed?'A vehicle is on its way to the loading point. The LR will be issued after loading.':done?'This consignment has been delivered.':'This consignment is on its way.';
    showRes((stale?'<div class="upd" role="status"><i aria-hidden="true"></i>Showing last known status, checking for updates...</div>':'')
      +badge('ok','&#10003;',title,sub)
      +'<div class="lrhead" style="margin-top:16px"><span class="no">'+esc(id)+'</span>'+pill+'</div>'
      +((d.from||d.to)?'<div class="route"><b>'+esc(d.from||'')+'</b>'+(d.to?' &rarr; <b>'+esc(d.to)+'</b>':'')+'</div>':'')
      +(d.drops&&d.drops.length?'<div class="drops"><h3>Deliveries on this vehicle</h3>'+d.drops.map(function(x,i){return '<div class="drop"><span class="dn">'+(i+1)+'</span><div class="dt"><b>'+esc(x.to||'-')+'</b>'+(x.toPlace?' <span>('+esc(x.toPlace)+')</span>':'')+'<small>'+(x.lrNo?'LR '+esc(x.lrNo):'LR after loading')+'</small></div><span class="pill '+(x.stage==='delivered'?'d':'t')+'">'+(x.stage==='delivered'?'Delivered'+(x.deliveredOn?' '+esc(x.deliveredOn):''):x.stage==='transit'?'In transit':'Awaiting loading')+'</span></div>'}).join('')+'</div>':'')
      +'<ul class="tl">'+li+'</ul><div class="links">'+'<a href="mailto:support@adityatransport.com">Email us about this '+(placed?'placement':'LR')+'</a></div>');
    document.title=(placed?'Vehicle placed: ':done?'Delivered: ':'In transit: ')+id+' | Aditya Transport';
    $('ttl').textContent='Track another shipment';
  }
  function setUrl(d){try{history.replaceState(null,'','?lr='+encodeURIComponent(d.lrNo)+'&k='+encodeURIComponent(d.k))}catch(e){}}
  function fromQR(lr,k){
    var key=lr+'|'+k,c=cget(key);
    if(c)render(c,true);else showLoading('Checking this LR and its delivery status...');
    call({action:'verify',lr:lr,k:k}).then(function(j){
      if(!j||!j.ok)showRes(badge('warn','!','Could not check right now',esc((j&&j.error)||'Please try again.')));
      else if(j.status==='genuine'){render(j);cput(key,j)}
      else if(j.status==='cancelled')showRes(badge('warn','!','This LR has been cancelled','LR '+esc(j.lrNo)+' was issued by Aditya Transport but is no longer valid. Please contact us before accepting it.'));
      else showRes(badge('bad','&#10005;','Not a valid Aditya Transport LR','We have no record matching this code. The LR may be altered or fake. Please contact us at support@adityatransport.com.'));
    }).catch(function(){showRes(badge('warn','!','Could not check right now','Check your internet connection and try again.'))});
  }
  function run(lr,veh){
    var isId=function(v){return /^AT(LR|VP)/.test(v)};if(!isId(lr)&&isId(veh)){var x=lr;lr=veh;veh=x}
    f.lr.value=lr;f.veh.value=veh;
    msg.hidden=true;go.disabled=true;go.innerHTML='<span class="sp"></span>Tracking...';
    showLoading('Searching for '+lr+'...');
    call({action:'track',lr:lr,veh:veh}).then(function(j){
      if(!j||!j.ok){hideRes();setMsg((j&&j.error)||'Could not check right now. Please try again.')}
      else if(j.status==='cancelled'){
        if(j.replacedBy){
          showRes(badge('warn','&#8635;','This vehicle was replaced','Vehicle '+esc(j.veh)+' (placement '+esc(j.placementNo)+') was cancelled'+(j.reason?' due to '+esc(j.reason):'')+'. A new vehicle <b>'+esc(j.replacedBy.veh)+'</b> has been placed'+(j.orderNo?' for order '+esc(j.orderNo):'')+'.')+'<button type="button" class="go" id="trkNew">Track the new vehicle</button>');
          $('trkNew').onclick=function(){run(nl(String(j.replacedBy.placementNo||'')),nv(String(j.replacedBy.veh||'')))};
        }else showRes(badge('warn','!','This vehicle placement was cancelled','Placement '+esc(j.placementNo)+' (vehicle '+esc(j.veh)+')'+(j.reason?' was cancelled due to '+esc(j.reason):' is no longer active')+'. If your order is re-planned, you will receive new vehicle details by email.'));
      }
      else if(j.status==='genuine'){render(j);if(j.lrNo&&j.k){cput(j.lrNo+'|'+j.k,j);setUrl(j)}else{try{history.replaceState(null,'','?lr='+encodeURIComponent(j.placementNo||lr)+'&veh='+encodeURIComponent(String(j.veh||veh).replace(/\s+/g,'')))}catch(e){}}}
      else{hideRes();setMsg('No consignment found with this LR or placement number and vehicle number. Please check both and try again, or write to support@adityatransport.com.')}
    }).catch(function(){hideRes();setMsg('Could not reach our system. Check your internet connection and try again.')})
    .then(function(){go.disabled=false;go.textContent='Track shipment'});
  }
  var nl=function(v){return v.replace(/\s+/g,'').toUpperCase()},nv=function(v){return v.replace(/[^A-Za-z0-9]/g,'').toUpperCase()};
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var lr=nl(f.lr.value),veh=nv(f.veh.value);
    if(!lr||!veh){hideRes();setMsg('Please enter both the LR or placement number and the vehicle number.');return}
    run(lr,veh);
  });
  var q=new URLSearchParams(location.search),ql=(q.get('lr')||'').trim(),qk=(q.get('k')||'').trim(),qv=(q.get('veh')||'').trim();
  if(ql&&qk){f.lr.value=nl(ql);fromQR(nl(ql),qk)}
  else if(ql&&qv){f.lr.value=nl(ql);f.veh.value=nv(qv);run(nl(ql),nv(qv))}
  else{if(ql)f.lr.value=nl(ql);if(qv)f.veh.value=nv(qv)}
})();
</script>
</body>
</html>
